<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏 - 杨璐溪</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 1200px;
            width: 100%;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 3.5rem;
            color: #4CAF50;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }
        
        .player-name {
            color: #FF9800;
            font-weight: bold;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 20px;
        }
        
        .game-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            width: 100%;
        }
        
        .game-container {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
        }
        
        #gameCanvas {
            background-color: #000;
            display: block;
        }
        
        .game-info {
            background-color: #1a1a1a;
            padding: 25px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        .score-container {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .score-title {
            font-size: 1.5rem;
            color: #aaa;
            margin-bottom: 10px;
        }
        
        .score {
            font-size: 3.5rem;
            font-weight: bold;
            color: #4CAF50;
        }
        
        .controls {
            margin-bottom: 30px;
        }
        
        .control-title {
            font-size: 1.3rem;
            color: #aaa;
            margin-bottom: 15px;
        }
        
        .control-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 8px;
            background-color: #222;
            border-radius: 5px;
        }
        
        .key {
            display: inline-block;
            padding: 5px 12px;
            background-color: #333;
            border-radius: 4px;
            margin-right: 15px;
            font-weight: bold;
            color: #4CAF50;
            min-width: 50px;
            text-align: center;
        }
        
        .instructions {
            background-color: #222;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .instructions h3 {
            color: #FF9800;
            margin-bottom: 10px;
        }
        
        .instructions ul {
            padding-left: 20px;
            line-height: 1.6;
        }
        
        .instructions li {
            margin-bottom: 8px;
            color: #ccc;
        }
        
        .instructions span.highlight {
            color: #4CAF50;
            font-weight: bold;
        }
        
        .game-buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 25px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }
        
        button:hover {
            background-color: #3d8b40;
            transform: translateY(-2px);
        }
        
        #restartBtn {
            background-color: #FF9800;
        }
        
        #restartBtn:hover {
            background-color: #e68900;
        }
        
        #pauseBtn {
            background-color: #2196F3;
        }
        
        #pauseBtn:hover {
            background-color: #0b7dda;
        }
        
        .game-status {
            margin-top: 20px;
            font-size: 1.3rem;
            text-align: center;
            height: 30px;
            color: #FF9800;
        }
        
        .mobile-controls {
            display: none;
            margin-top: 30px;
            width: 100%;
            max-width: 300px;
        }
        
        .mobile-controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }
        
        .mobile-btn {
            height: 70px;
            background-color: #333;
            border: none;
            border-radius: 10px;
            font-size: 1.8rem;
            color: #4CAF50;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .mobile-btn.up {
            grid-column: 2;
            grid-row: 1;
        }
        
        .mobile-btn.down {
            grid-column: 2;
            grid-row: 2;
        }
        
        .mobile-btn.left {
            grid-column: 1;
            grid-row: 2;
        }
        
        .mobile-btn.right {
            grid-column: 3;
            grid-row: 2;
        }
        
        .mobile-btn.pause {
            grid-column: 1 / span 3;
            grid-row: 3;
            margin-top: 10px;
            background-color: #2196F3;
            color: white;
            font-size: 1.3rem;
        }
        
        @media (max-width: 768px) {
            .game-area {
                flex-direction: column;
                align-items: center;
            }
            
            .game-info {
                width: 100%;
                max-width: 400px;
            }
            
            .mobile-controls {
                display: block;
            }
            
            h1 {
                font-size: 2.5rem;
            }
        }
        
        .apple-color {
            color: #ff4444;
            font-weight: bold;
        }
        
        footer {
            margin-top: 40px;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>贪吃蛇游戏</h1>
            <div class="subtitle">玩家: <span class="player-name">杨璐溪</span> | 吃到<span class="apple-color">红色苹果</span>蛇会变长</div>
        </header>
        
        <div class="game-area">
            <div class="game-container">
                <canvas id="gameCanvas" width="600" height="600"></canvas>
            </div>
            
            <div class="game-info">
                <div class="score-container">
                    <div class="score-title">得分</div>
                    <div class="score" id="score">0</div>
                </div>
                
                <div class="controls">
                    <div class="control-title">控制方式</div>
                    <div class="control-item">
                        <div class="key">↑</div>
                        <div>向上移动</div>
                    </div>
                    <div class="control-item">
                        <div class="key">↓</div>
                        <div>向下移动</div>
                    </div>
                    <div class="control-item">
                        <div class="key">←</div>
                        <div>向左移动</div>
                    </div>
                    <div class="control-item">
                        <div class="key">→</div>
                        <div>向右移动</div>
                    </div>
                    <div class="control-item">
                        <div class="key">空格</div>
                        <div>暂停/继续游戏</div>
                    </div>
                </div>
                
                <div class="instructions">
                    <h3>游戏规则</h3>
                    <ul>
                        <li>使用键盘方向键控制蛇的移动方向</li>
                        <li>吃到<span class="highlight">红色苹果</span>可以增加得分并使蛇身变长</li>
                        <li>避免撞到墙壁或自己的身体</li>
                        <li>游戏速度会随着得分增加而提高</li>
                        <li>每吃到一个苹果得10分</li>
                    </ul>
                </div>
                
                <div class="game-buttons">
                    <button id="startBtn">开始游戏</button>
                    <button id="pauseBtn">暂停游戏</button>
                    <button id="restartBtn">重新开始</button>
                </div>
                
                <div class="game-status" id="gameStatus">点击"开始游戏"按钮开始</div>
            </div>
        </div>
        
        <div class="mobile-controls">
            <div class="mobile-controls-grid">
                <button class="mobile-btn up" id="mobileUp">↑</button>
                <button class="mobile-btn down" id="mobileDown">↓</button>
                <button class="mobile-btn left" id="mobileLeft">←</button>
                <button class="mobile-btn right" id="mobileRight">→</button>
                <button class="mobile-btn pause" id="mobilePause">暂停/继续</button>
            </div>
        </div>
        
        <footer>
            贪吃蛇游戏 - 为杨璐溪创建 | HTML5 Canvas实现
        </footer>
    </div>

    <script>
        // 获取Canvas元素和上下文
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 游戏变量
        const gridSize = 20; // 网格大小
        const tileCount = canvas.width / gridSize; // 网格数量
        
        let snake = [];
        let direction = { x: 0, y: 0 };
        let food = {};
        let score = 0;
        let gameSpeed = 10; // 初始游戏速度
        let gameRunning = false;
        let gamePaused = false;
        let gameLoop;
        
        // DOM元素
        const scoreElement = document.getElementById('score');
        const gameStatusElement = document.getElementById('gameStatus');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        
        // 移动控制按钮
        const mobileUp = document.getElementById('mobileUp');
        const mobileDown = document.getElementById('mobileDown');
        const mobileLeft = document.getElementById('mobileLeft');
        const mobileRight = document.getElementById('mobileRight');
        const mobilePause = document.getElementById('mobilePause');
        
        // 初始化游戏
        function initGame() {
            // 初始化蛇
            snake = [
                { x: 10, y: 10 } // 蛇头初始位置
            ];
            
            // 初始方向向右
            direction = { x: 1, y: 0 };
            
            // 初始化食物
            generateFood();
            
            // 重置分数和速度
            score = 0;
            gameSpeed = 10;
            scoreElement.textContent = score;
            
            // 绘制初始游戏状态
            drawGame();
            
            // 更新游戏状态文本
            gameStatusElement.textContent = "准备开始";
        }
        
        // 生成食物
        function generateFood() {
            // 随机生成食物位置
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            
            // 确保食物不会生成在蛇身上
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    return generateFood();
                }
            }
        }
        
        // 绘制游戏
        function drawGame() {
            // 清除画布
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制蛇
            for (let i = 0; i < snake.length; i++) {
                // 蛇头颜色
                if (i === 0) {
                    ctx.fillStyle = '#4CAF50'; // 蛇头绿色
                } else {
                    // 蛇身颜色渐变
                    const greenValue = Math.max(100, 255 - (i * 5));
                    ctx.fillStyle = `rgb(76, ${greenValue}, 80)`;
                }
                
                // 绘制蛇身段
                ctx.fillRect(snake[i].x * gridSize, snake[i].y * gridSize, gridSize - 1, gridSize - 1);
                
                // 为蛇头添加眼睛
                if (i === 0) {
                    ctx.fillStyle = '#000';
                    // 根据方向确定眼睛位置
                    if (direction.x === 1) { // 向右
                        ctx.fillRect(snake[i].x * gridSize + 12, snake[i].y * gridSize + 5, 4, 4);
                        ctx.fillRect(snake[i].x * gridSize + 12, snake[i].y * gridSize + 11, 4, 4);
                    } else if (direction.x === -1) { // 向左
                        ctx.fillRect(snake[i].x * gridSize + 4, snake[i].y * gridSize + 5, 4, 4);
                        ctx.fillRect(snake[i].x * gridSize + 4, snake[i].y * gridSize + 11, 4, 4);
                    } else if (direction.y === -1) { // 向上
                        ctx.fillRect(snake[i].x * gridSize + 5, snake[i].y * gridSize + 4, 4, 4);
                        ctx.fillRect(snake[i].x * gridSize + 11, snake[i].y * gridSize + 4, 4, 4);
                    } else if (direction.y === 1) { // 向下
                        ctx.fillRect(snake[i].x * gridSize + 5, snake[i].y * gridSize + 12, 4, 4);
                        ctx.fillRect(snake[i].x * gridSize + 11, snake[i].y * gridSize + 12, 4, 4);
                    }
                }
            }
            
            // 绘制食物（红色苹果）
            ctx.fillStyle = '#ff4444';
            ctx.beginPath();
            const centerX = food.x * gridSize + gridSize / 2;
            const centerY = food.y * gridSize + gridSize / 2;
            const radius = gridSize / 2 - 2;
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.fill();
            
            // 添加苹果梗
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(centerX - 1, centerY - radius - 3, 2, 5);
            
            // 添加苹果叶子
            ctx.fillStyle = '#2E8B57';
            ctx.beginPath();
            ctx.ellipse(centerX + 3, centerY - radius - 1, 4, 2, 0, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // 更新游戏状态
        function updateGame() {
            if (!gameRunning || gamePaused) return;
            
            // 移动蛇头
            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            
            // 检查是否撞墙
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }
            
            // 检查是否撞到自己
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }
            
            // 将新头部添加到蛇身
            snake.unshift(head);
            
            // 检查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                // 增加分数
                score += 10;
                scoreElement.textContent = score;
                
                // 每得50分增加游戏速度
                if (score % 50 === 0) {
                    gameSpeed += 2;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(updateGame, 1000 / gameSpeed);
                    gameStatusElement.textContent = "速度提升!";
                    setTimeout(() => {
                        if (gameRunning && !gamePaused) {
                            gameStatusElement.textContent = "游戏进行中";
                        }
                    }, 1000);
                }
                
                // 生成新食物
                generateFood();
            } else {
                // 如果没有吃到食物，移除蛇尾
                snake.pop();
            }
            
            // 绘制更新后的游戏状态
            drawGame();
        }
        
        // 游戏结束
        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            gameStatusElement.textContent = `游戏结束! 最终得分: ${score}`;
            
            // 绘制游戏结束效果
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('游戏结束!', canvas.width / 2, canvas.height / 2 - 30);
            
            ctx.font = '30px Arial';
            ctx.fillText(`得分: ${score}`, canvas.width / 2, canvas.height / 2 + 20);
        }
        
        // 开始游戏
        function startGame() {
            if (gameRunning) return;
            
            gameRunning = true;
            gamePaused = false;
            gameStatusElement.textContent = "游戏进行中";
            
            // 如果蛇为空，初始化游戏
            if (snake.length === 0) {
                initGame();
            }
            
            // 设置游戏循环
            clearInterval(gameLoop);
            gameLoop = setInterval(updateGame, 1000 / gameSpeed);
        }
        
        // 暂停/继续游戏
        function togglePause() {
            if (!gameRunning) return;
            
            gamePaused = !gamePaused;
            
            if (gamePaused) {
                gameStatusElement.textContent = "游戏已暂停";
                pauseBtn.textContent = "继续游戏";
            } else {
                gameStatusElement.textContent = "游戏进行中";
                pauseBtn.textContent = "暂停游戏";
            }
        }
        
        // 重新开始游戏
        function restartGame() {
            clearInterval(gameLoop);
            initGame();
            gameRunning = false;
            gamePaused = false;
            gameStatusElement.textContent = "点击'开始游戏'按钮开始";
            pauseBtn.textContent = "暂停游戏";
        }
        
        // 键盘控制
        function handleKeyDown(e) {
            if (!gameRunning || gamePaused) return;
            
            // 防止按键滚动页面
            if ([37, 38, 39, 40, 32].includes(e.keyCode)) {
                e.preventDefault();
            }
            
            // 上箭头或W键
            if ((e.keyCode === 38 || e.keyCode === 87) && direction.y !== 1) {
                direction = { x: 0, y: -1 };
            }
            // 下箭头或S键
            else if ((e.keyCode === 40 || e.keyCode === 83) && direction.y !== -1) {
                direction = { x: 0, y: 1 };
            }
            // 左箭头或A键
            else if ((e.keyCode === 37 || e.keyCode === 65) && direction.x !== 1) {
                direction = { x: -1, y: 0 };
            }
            // 右箭头或D键
            else if ((e.keyCode === 39 || e.keyCode === 68) && direction.x !== -1) {
                direction = { x: 1, y: 0 };
            }
            // 空格键暂停/继续
            else if (e.keyCode === 32) {
                togglePause();
            }
        }
        
        // 移动设备控制
        mobileUp.addEventListener('click', () => {
            if (gameRunning && !gamePaused && direction.y !== 1) {
                direction = { x: 0, y: -1 };
            }
        });
        
        mobileDown.addEventListener('click', () => {
            if (gameRunning && !gamePaused && direction.y !== -1) {
                direction = { x: 0, y: 1 };
            }
        });
        
        mobileLeft.addEventListener('click', () => {
            if (gameRunning && !gamePaused && direction.x !== 1) {
                direction = { x: -1, y: 0 };
            }
        });
        
        mobileRight.addEventListener('click', () => {
            if (gameRunning && !gamePaused && direction.x !== -1) {
                direction = { x: 1, y: 0 };
            }
        });
        
        mobilePause.addEventListener('click', togglePause);
        
        // 按钮事件监听
        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', togglePause);
        restartBtn.addEventListener('click', restartGame);
        
        // 键盘事件监听
        document.addEventListener('keydown', handleKeyDown);
        
        // 初始化游戏
        initGame();
        
        // 触摸设备检测
        function isTouchDevice() {
            return 'ontouchstart' in window || navigator.maxTouchPoints;
        }
        
        // 如果是触摸设备，显示移动控制按钮
        if (isTouchDevice()) {
            document.querySelector('.mobile-controls').style.display = 'block';
        }
    </script>
</body>
</html>
