<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>贪吃蛇游戏 - lol</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 防止手机端长按选中文字 */
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 1200px;
            width: 100%;
        }
        
        header {
            text-align: center;
            margin-bottom: 20px;
            animation: fadeInDown 0.8s ease-out;
        }
        
        h1 {
            font-size: 2.5rem;
            color: #4CAF50;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(76, 175, 80, 0.6);
            letter-spacing: 2px;
        }
        
        .player-name {
            color: #FF9800;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 152, 0, 0.5);
        }
        
        .subtitle {
            font-size: 1rem;
            color: #ccc;
            margin-bottom: 15px;
        }
        
        /* 游戏主区域布局优化 */
        .game-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 100%;
        }
        
        .game-container {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.1);
            border: 2px solid #333;
        }
        
        #gameCanvas {
            background-color: #050505;
            display: block;
            cursor: pointer;
        }
        
        .game-info {
            background-color: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 12px;
            width: 280px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        /* 分数板样式优化 */
        .score-board {
            display: flex;
            justify-content: space-between;
            background: #222;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
        }
        
        .score-item {
            text-align: center;
        }
        
        .score-label {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 5px;
        }
        
        .score-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
        }
        
        .high-score .score-value {
            color: #FF9800;
        }
        
        /* 难度选择器 */
        .difficulty-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        
        .difficulty-btn {
            background: #333;
            border: 1px solid #444;
            color: #aaa;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .difficulty-btn.active {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }

        .controls-info {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.5;
        }
        
        .game-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        button.action-btn {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, filter 0.2s;
            color: white;
        }
        
        button.action-btn:active {
            transform: scale(0.95);
        }
        
        #startBtn { background: linear-gradient(135deg, #4CAF50, #45a049); grid-column: span 2; }
        #pauseBtn { background: linear-gradient(135deg, #2196F3, #1976D2); }
        #restartBtn { background: linear-gradient(135deg, #FF9800, #F57C00); }
        
        .game-status {
            text-align: center;
            color: #FF9800;
            font-weight: bold;
            min-height: 24px;
        }
        
        /* 移动端控制优化 */
        .mobile-controls {
            display: none; /* 默认隐藏，JS检测到触摸屏显示 */
            margin-top: 20px;
            width: 100%;
            max-width: 280px;
        }
        
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 60px);
            gap: 8px;
        }
        
        .d-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #4CAF50;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }
        
        .d-btn:active { background: rgba(76, 175, 80, 0.3); }
        
        .up { grid-column: 2; grid-row: 1; }
        .left { grid-column: 1; grid-row: 2; }
        .down { grid-column: 2; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
        
        .mobile-tip {
            text-align: center;
            font-size: 0.8rem;
            color: #555;
            margin-top: 10px;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            color: #444;
            font-size: 0.8rem;
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .game-area { flex-direction: column; align-items: center; }
            .game-info { width: 100%; max-width: 360px; }
            canvas { width: 100%; height: auto; } /* 响应式画布 */
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 开始画面样式 */
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.5s ease-out;
            cursor: pointer;
        }

        .game-title {
            font-size: 5rem;
            color: #4CAF50;
            text-shadow: 0 0 30px rgba(76, 175, 80, 0.8);
            margin-bottom: 30px;
            letter-spacing: 5px;
            animation: pulse 2s infinite;
        }

        .start-hint {
            font-size: 1.5rem;
            color: #ccc;
            text-align: center;
            animation: blink 1.5s infinite;
            margin-top: 20px;
            padding: 10px 20px;
            background: rgba(76, 175, 80, 0.2);
            border-radius: 10px;
            border: 1px solid rgba(76, 175, 80, 0.5);
        }

        /* 游戏结束界面样式 */
        .game-over-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1001;
            backdrop-filter: blur(5px);
        }

        .game-over-screen h2 {
            font-size: 4rem;
            color: #ff4444;
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.7);
            margin-bottom: 20px;
        }

        .final-score {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 40px;
        }

        .final-score span {
            color: #4CAF50;
            font-weight: bold;
        }

        .play-again-btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .play-again-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        /* 左上角分数显示 */
        .top-left-score {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 1.8rem;
            color: #4CAF50;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
            z-index: 999;
            display: none;
            transition: transform 0.1s ease-out;
        }

        /* 分数动画效果 */
        .score-popup {
            position: absolute;
            color: #4CAF50;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(76, 175, 80, 0.8);
            pointer-events: none;
            font-size: 16px;
            opacity: 0;
            transition: all 0.5s;
        }

        /* 动画 */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- 开始画面 -->
    <div id="startScreen" class="start-screen">
        <h1 class="game-title">贪吃蛇</h1>
        <p class="start-hint">按任意键或点击开始游戏</p>
    </div>

    <!-- 游戏结束界面 -->
    <div id="gameOverScreen" class="game-over-screen">
        <h2>Game Over</h2>
        <p class="final-score">分数: <span id="finalScore">0</span></p>
        <button id="playAgainBtn" class="play-again-btn">再玩一次</button>
    </div>

    <!-- 左上角分数显示 -->
    <div id="topLeftScore" class="top-left-score">0</div>

    <div class="container">
        <header>
            <h1>贪吃蛇游戏</h1>
            <div class="subtitle">玩家: <span class="player-name">杨璐溪</span> | 专为你升级打造</div>
        </header>
        
        <div class="game-area">
            <div class="game-container">
                <canvas id="gameCanvas" width="400" height="400"></canvas>
            </div>
            
            <div class="game-info">
                <div class="score-board">
                    <div class="score-item">
                        <div class="score-label">当前得分</div>
                        <div class="score-value" id="score">0</div>
                    </div>
                    <div class="score-item high-score">
                        <div class="score-label">历史最高</div>
                        <div class="score-value" id="highScore">0</div>
                    </div>
                </div>
                
                <div class="difficulty-selector">
                    <button class="difficulty-btn active" data-speed="8">简单</button>
                    <button class="difficulty-btn" data-speed="12">普通</button>
                    <button class="difficulty-btn" data-speed="18">困难</button>
                </div>

                <div class="controls-info">
                    <p><strong>操作指南:</strong></p>
                    <p>💻 键盘方向键 或 WASD</p>
                    <p>📱 屏幕滑动 或 点击按钮</p>
                </div>
                
                <div class="game-buttons">
                    <button id="startBtn" class="action-btn">开始游戏</button>
                    <button id="pauseBtn" class="action-btn">暂停</button>
                    <button id="restartBtn" class="action-btn">重置</button>
                </div>
                
                <div class="game-status" id="gameStatus">选择难度后开始</div>
            </div>
        </div>
        
        <div class="mobile-controls">
            <div class="d-pad">
                <button class="d-btn up" id="mobileUp">▲</button>
                <button class="d-btn left" id="mobileLeft">◀</button>
                <button class="d-btn down" id="mobileDown">▼</button>
                <button class="d-btn right" id="mobileRight">▶</button>
            </div>
            <div class="mobile-tip">你也可以直接在游戏画面上滑动手指</div>
        </div>
        
        <footer>
            贪吃蛇增强版 - 为杨璐溪创建 | 支持滑动控制
        </footer>
    </div>

    <script>
        // 获取Canvas元素和上下文
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 游戏配置
        const gridSize = 20; 
        const tileCount = canvas.width / gridSize;
        
        // 游戏状态变量
        let snake = [];
        let direction = { x: 0, y: 0 };
        let nextDirection = { x: 0, y: 0 }; // 缓冲输入，防止单帧多次转向导致自杀
        let food = {};
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let baseGameSpeed = 8;
        let currentSpeed = 8;
        let gameRunning = false;
        let gamePaused = false;
        let gameLoop;
        let particles = []; // 粒子数组

        // DOM元素
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const gameStatusElement = document.getElementById('gameStatus');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const difficultyBtns = document.querySelectorAll('.difficulty-btn');
        
        // 新添加的DOM元素
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreElement = document.getElementById('finalScore');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const topLeftScoreElement = document.getElementById('topLeftScore');

        // 初始化最高分显示
        highScoreElement.textContent = highScore;

        // 粒子系统类
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.life = 1.0; // 生命值 1.0 -> 0
                this.decay = Math.random() * 0.03 + 0.02;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // 初始化游戏
        function initGame() {
            snake = [{ x: 10, y: 10 }];
            direction = { x: 1, y: 0 }; // 初始向右
            nextDirection = { x: 1, y: 0 };
            generateFood();
            score = 0;
            scoreElement.textContent = score;
            topLeftScoreElement.textContent = "0";
            particles = [];
            drawGame();
            gameStatusElement.textContent = "准备开始";
        }
        
        // 显示开始画面
        function showStartScreen() {
            startScreen.style.display = 'flex';
            gameOverScreen.style.display = 'none';
            topLeftScoreElement.style.display = 'none';
            gameRunning = false;
            gamePaused = false;
            pauseBtn.textContent = "暂停";
        }
        
        // 隐藏开始画面，开始游戏
        function hideStartScreen() {
            startScreen.style.display = 'none';
            topLeftScoreElement.style.display = 'block';
            updateTopLeftScore();
            startGame();
        }
        
        // 显示游戏结束界面
        function showGameOver() {
            gameOverScreen.style.display = 'flex';
            finalScoreElement.textContent = score;
            topLeftScoreElement.style.display = 'none';
        }
        
        // 隐藏游戏结束界面
        function hideGameOver() {
            gameOverScreen.style.display = 'none';
        }
        
        // 更新左上角分数显示
        function updateTopLeftScore() {
            topLeftScoreElement.textContent = score;
            // 添加一个简单的动画效果
            topLeftScoreElement.style.transform = 'scale(1.2)';
            setTimeout(() => {
                topLeftScoreElement.style.transform = 'scale(1)';
            }, 100);
        }
        
        // 显示分数增加动画
        function showScoreAnimation(x, y) {
            const scorePopup = document.createElement('div');
            scorePopup.textContent = '+10';
            scorePopup.classList.add('score-popup');
            
            // 转换为像素坐标
            const pixelX = x * gridSize + gridSize / 2;
            const pixelY = y * gridSize;
            
            scorePopup.style.left = pixelX + 'px';
            scorePopup.style.top = pixelY + 'px';
            
            document.querySelector('.game-container').appendChild(scorePopup);
            
            // 开始动画
            setTimeout(() => {
                scorePopup.style.top = (pixelY - 40) + 'px';
                scorePopup.style.opacity = '1';
            }, 10);
            
            // 移除元素
            setTimeout(() => {
                scorePopup.remove();
            }, 510);
        }
        
        // 生成食物
        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    return generateFood();
                }
            }
        }

        // 创建爆炸特效
        function createExplosion(x, y, color) {
            for (let i = 0; i < 12; i++) {
                // 将网格坐标转换为像素中心坐标
                const pixelX = x * gridSize + gridSize / 2;
                const pixelY = y * gridSize + gridSize / 2;
                particles.push(new Particle(pixelX, pixelY, color));
            }
        }
        
        // 绘制游戏
        function drawGame() {
            // 1. 绘制背景
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 2. 绘制网格线 (可选，增加科技感)
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 1;
            for(let i=0; i<tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i*gridSize, 0);
                ctx.lineTo(i*gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i*gridSize);
                ctx.lineTo(canvas.width, i*gridSize);
                ctx.stroke();
            }
            
            // 3. 绘制粒子
            particles.forEach((p, index) => {
                if (p.life <= 0) {
                    particles.splice(index, 1);
                } else {
                    p.update();
                    p.draw(ctx);
                }
            });

            // 4. 绘制食物
            ctx.fillStyle = '#ff4444';
            ctx.shadowColor = '#ff4444';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            const centerX = food.x * gridSize + gridSize / 2;
            const centerY = food.y * gridSize + gridSize / 2;
            ctx.arc(centerX, centerY, gridSize / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0; // 重置阴影
            
            // 苹果叶子
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.ellipse(centerX + 3, centerY - 5, 4, 2, Math.PI / 4, 0, Math.PI * 2);
            ctx.fill();
            
            // 5. 绘制蛇
            for (let i = 0; i < snake.length; i++) {
                if (i === 0) {
                    ctx.fillStyle = '#4CAF50'; // 蛇头
                    ctx.shadowColor = '#4CAF50';
                    ctx.shadowBlur = 15;
                } else {
                    // 蛇身渐变色
                    const alpha = 1 - (i / (snake.length + 5));
                    ctx.fillStyle = `rgba(76, 175, 80, ${Math.max(0.3, alpha)})`;
                    ctx.shadowBlur = 0;
                }
                
                // 绘制圆角矩形
                const x = snake[i].x * gridSize + 1;
                const y = snake[i].y * gridSize + 1;
                const size = gridSize - 2;
                ctx.fillRect(x, y, size, size);
                
                // 绘制蛇头眼睛
                if (i === 0) {
                    ctx.fillStyle = 'white';
                    ctx.shadowBlur = 0;
                    let eyeOffsetX = 0, eyeOffsetY = 0;
                    if (direction.x === 1) eyeOffsetX = 4;
                    if (direction.x === -1) eyeOffsetX = -4;
                    if (direction.y === 1) eyeOffsetY = 4;
                    if (direction.y === -1) eyeOffsetY = -4;
                    
                    ctx.beginPath();
                    ctx.arc(centerX + eyeOffsetX - 3, centerY + eyeOffsetY - 3, 2, 0, Math.PI*2);
                    ctx.arc(centerX + eyeOffsetX + 3, centerY + eyeOffsetY + 3, 2, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }
        
        // 更新游戏逻辑
        function updateGame() {
            if (!gameRunning || gamePaused) return;
            
            // 应用缓冲的方向（防止快速按键导致的bug）
            direction = nextDirection;

            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
            
            // 撞墙检测
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }
            
            // 撞自身检测
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }
            
            snake.unshift(head);
            
            // 吃食物 - 每次加10分
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                updateTopLeftScore();
                showScoreAnimation(head.x, head.y); // 显示分数动画
                createExplosion(head.x, head.y, '#ff4444'); // 触发特效
                
                // 更新最高分
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }

                // 速度随分数微调
                const newSpeed = baseGameSpeed + Math.floor(score / 50);
                if (newSpeed !== currentSpeed) {
                    currentSpeed = newSpeed;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(updateGame, 1000 / currentSpeed);
                }
                
                generateFood();
            } else {
                snake.pop();
            }
            
            drawGame();
        }
        
        // 游戏结束
        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            gameStatusElement.textContent = `游戏结束! 得分: ${score}`;
            showGameOver();
        }
        
        // 开始游戏
        function startGame() {
            if (gameRunning) return;
            gameRunning = true;
            gamePaused = false;
            gameStatusElement.textContent = "游戏中...";
            if (snake.length === 0 || score === 0 && snake.length === 1) initGame();
            
            clearInterval(gameLoop);
            gameLoop = setInterval(updateGame, 1000 / currentSpeed);
        }
        
        // 暂停/继续
        function togglePause() {
            if (!gameRunning) return;
            gamePaused = !gamePaused;
            pauseBtn.textContent = gamePaused ? "继续" : "暂停";
            gameStatusElement.textContent = gamePaused ? "已暂停" : "游戏中...";
        }
        
        // 重新开始
        function restartGame() {
            clearInterval(gameLoop);
            gameRunning = false;
            gamePaused = false;
            pauseBtn.textContent = "暂停";
            gameStatusElement.textContent = "选择难度后开始";
            showStartScreen(); // 重新显示开始画面
        }
        
        // 改变方向的核心函数（包含防反向逻辑）
        function changeDirection(newDir) {
            if (!gameRunning || gamePaused) return;
            
            // 禁止直接掉头
            if (newDir.x !== 0 && direction.x !== 0) return;
            if (newDir.y !== 0 && direction.y !== 0) return;
            
            nextDirection = newDir;
        }
        
        // 键盘控制
        document.addEventListener('keydown', (e) => {
            // 如果开始画面显示，按任意键开始游戏
            if (startScreen.style.display !== 'none') {
                hideStartScreen();
                return;
            }
            
            if ([37, 38, 39, 40, 32].includes(e.keyCode)) e.preventDefault();
            
            const key = e.keyCode;
            if ((key === 38 || key === 87) && direction.y !== 1) changeDirection({ x: 0, y: -1 });
            else if ((key === 40 || key === 83) && direction.y !== -1) changeDirection({ x: 0, y: 1 });
            else if ((key === 37 || key === 65) && direction.x !== 1) changeDirection({ x: -1, y: 0 });
            else if ((key === 39 || key === 68) && direction.x !== -1) changeDirection({ x: 1, y: 0 });
            else if (key === 32) togglePause();
        });

        // 触摸滑动控制 (Touch Swipe)
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            // 如果开始画面显示，点击开始游戏
            if (startScreen.style.display !== 'none') {
                hideStartScreen();
                e.preventDefault();
                return;
            }
            
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            e.preventDefault(); // 防止默认滚动
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            if (!gameRunning || gamePaused) return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            
            // 简单的判定阈值，避免误触
            if (Math.abs(diffX) > Math.abs(diffY)) {
                // 水平滑动
                if (Math.abs(diffX) > 30) {
                    if (diffX > 0) changeDirection({ x: 1, y: 0 });
                    else changeDirection({ x: -1, y: 0 });
                }
            } else {
                // 垂直滑动
                if (Math.abs(diffY) > 30) {
                    if (diffY > 0) changeDirection({ x: 0, y: 1 });
                    else changeDirection({ x: 0, y: -1 });
                }
            }
        }, { passive: false });

        // 难度选择逻辑
        difficultyBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // 移除其他按钮激活状态
                difficultyBtns.forEach(b => b.classList.remove('active'));
                // 激活当前按钮
                btn.classList.add('active');
                // 设置速度
                baseGameSpeed = parseInt(btn.getAttribute('data-speed'));
                currentSpeed = baseGameSpeed;
                // 如果正在游戏，立即应用新速度（可选，这里选择重置游戏逻辑更清晰）
                if (gameRunning) {
                    restartGame();
                    gameStatusElement.textContent = "难度已更新，请重新开始";
                } else {
                    gameStatusElement.textContent = `已选择: ${btn.innerText} 模式`;
                }
            });
        });
        
        // 按钮事件绑定
        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', togglePause);
        restartBtn.addEventListener('click', restartGame);
        
        // 移动端按钮点击
        document.getElementById('mobileUp').addEventListener('click', () => changeDirection({ x: 0, y: -1 }));
        document.getElementById('mobileDown').addEventListener('click', () => changeDirection({ x: 0, y: 1 }));
        document.getElementById('mobileLeft').addEventListener('click', () => changeDirection({ x: -1, y: 0 }));
        document.getElementById('mobileRight').addEventListener('click', () => changeDirection({ x: 1, y: 0 }));

        // 新添加的事件监听器
        // 点击开始画面开始游戏
        startScreen.addEventListener('click', function() {
            hideStartScreen();
        });

        // 再玩一次按钮
        playAgainBtn.addEventListener('click', function() {
            hideGameOver();
            restartGame();
        });

        // 触摸设备检测显示控制按钮
        if ('ontouchstart' in window || navigator.maxTouchPoints) {
            document.querySelector('.mobile-controls').style.display = 'block';
        }

        // 初始化游戏
        showStartScreen();
        initGame();
    </script>
</body>
</html>
